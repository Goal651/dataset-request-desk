[project]
name = "dataset-request-desk"
version = "0.1.0"
description = "Internal platform for dataset requests: clients submit requests, operators fulfil them with robot episodes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<5",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI dependency injection is built on function calls in defaults
# (Query(...), Depends(...), File(...)); these are intentional, not bugs.
# UP042: str+Enum is kept over StrEnum; it is the well-trodden path with
# SQLAlchemy's Enum() type and native Postgres enums.
ignore = ["B008", "UP042"]
