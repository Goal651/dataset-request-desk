name: dataset-request-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drd
      POSTGRES_PASSWORD: drd
      POSTGRES_DB: drd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drd -d drd"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://drd:drd@db:5432/drd
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-32+}
      ENVIRONMENT: compose
    volumes:
      - ./backend:/srv/backend
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./backend
    command: python -m app.seed
    environment:
      <<: *backend_env
      SEED_USERS_PATH: /seed/users.json
    volumes:
      - ./backend:/srv/backend
      - ./seed:/seed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend_env
      SEED_USERS_PATH: /seed/users.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv/backend
      - ./seed:/seed:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    command: python -m pytest tests -q
    environment:
      <<: *backend_env
      TEST_DATABASE_URL: postgresql+psycopg://drd:drd@db:5432/drd_test
      SEED_CSV_PATH: /srv/seed/episodes.csv
    volumes:
      - ./backend:/srv/backend
      - ./seed:/srv/seed:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      PUBLIC_API_BASE_URL: http://localhost:8000

volumes:
  pgdata:
